[package]
name = "uu-filer"
version = "0.1.0"
edition = "2021"
description = "Privacy-first local batch file organizer"
license = "MIT"

[lib]
name = "uu_filer"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uu-filer"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:keyring"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pdf-extract = "0.10"
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
